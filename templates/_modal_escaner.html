<div id="modal-escaner" class="modal-escaner" hidden aria-hidden="true">
  <div class="modal-escaner-fondo" data-cerrar-escaner></div>
  <div class="modal-escaner-panel" role="dialog" aria-labelledby="modal-escaner-titulo">
    <header class="modal-escaner-header">
      <h2 id="modal-escaner-titulo">Escanear codigo</h2>
      <button type="button" class="modal-escaner-cerrar" data-cerrar-escaner aria-label="Cerrar">✕</button>
    </header>
    <p class="modal-escaner-ayuda">Apunte la camara al codigo de barras del producto</p>
    <div id="escaner-ayuda-https" class="escaner-ayuda-https" hidden>
      <strong>Camara requiere HTTPS</strong>
      <p id="escaner-texto-modo"></p>
      <p>En el celular abra:</p>
      <p><a href="#" data-url-https target="_self" rel="noopener"></a></p>
      <p class="escaner-ayuda-chica">Certificado: <em>Avanzado</em> → <em>Continuar</em>. O escriba el codigo a mano.</p>
    </div>
    <div id="escaner-reader" class="escaner-reader"></div>
    <p id="escaner-estado" class="escaner-estado">Iniciando camara...</p>
    <button type="button" class="btn-secundario" data-cerrar-escaner>Cancelar</button>
  </div>
</div>
