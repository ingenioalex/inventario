# Despliegue en Render.com (plan gratuito)
# https://render.com — conecte su repositorio de GitHub
services:
  - type: web
    name: inventario-hb318
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.0"
      # Opcional: pegue aqui la URL de Neon (ver DEPLOY_NUBE.md)
      # - key: DATABASE_URL
      #   sync: false
